name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install companion dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app.py scripts src tests
      - name: Test
        run: pytest
      - name: Reproduce benchmark
        run: python scripts/run_benchmark.py --output ci-results
