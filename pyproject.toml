[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wti-forecasting"
version = "1.0.0"
description = "Reproducible benchmark companion for the WTI forecasting research notebook"
readme = "readMe.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
app = ["streamlit>=1.38"]
dev = ["pytest>=8.0", "ruff>=0.6"]
xgboost = ["xgboost>=2.0"]

[project.scripts]
wti-benchmark = "wti_forecasting.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
